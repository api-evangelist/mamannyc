name: Maman
description: >-
  Maman is a French-inspired bakery and cafe chain founded in New York City, with locations
  across the United States and Canada. Maman serves seasonal pastries, coffee, salads, sandwiches
  and its signature nutty chocolate chip cookie in design-forward spaces, and operates online
  ordering for pickup and delivery, a nationwide cookie and gift shop, full-service event and
  corporate catering, private event venues, a loyalty mobile app, and a published cookbook. This
  API Evangelist profile tracks Maman's public web and commerce properties; the company exposes
  no first-party developer API surface.
